title: Scheduled Task Created to Run From a User-Writable Directory
id: d40a6d2c-5d3a-4852-ab0f-5db3dbcee958
status: experimental
description: >-
  Detects schtasks.exe creating a task whose command line points into a
  user-writable directory such as AppData, Temp or the Public profile.
  Demo rule written for Detection Toolkit v0.1.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Detection Toolkit demo content
date: 2026-11-11
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_create:
    CommandLine|contains: ' /create '
  selection_path:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
  condition: all of selection_*
falsepositives:
  - Per-user software updaters that register their own tasks
level: medium
